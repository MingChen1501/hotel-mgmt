name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files via the API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter (issue #120): decides which heavy jobs a change needs.
  # Always runs. Docs-only changes (docs/**, template/**, markdown,
  # issue/PR templates) match no code filter below, so every heavy job
  # is skipped and the PR is gated on the metadata `ci` job alone.
  # A change to this workflow file (or a push to master) runs the full
  # matrix, so no PR can go green without its required checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go-matrix: ${{ steps.gates.outputs.go-matrix }}
      node-matrix: ${{ steps.gates.outputs.node-matrix }}
      postgres-matrix: ${{ steps.gates.outputs.postgres-matrix }}
      billing: ${{ steps.gates.outputs.billing }}
      contracts: ${{ steps.gates.outputs.contracts }}
      migrate: ${{ steps.gates.outputs.migrate }}
      e2e: ${{ steps.gates.outputs.e2e }}
      shell: ${{ steps.gates.outputs.shell }}
      browser-e2e: ${{ steps.gates.outputs.browser-e2e }}
      dom-diff: ${{ steps.gates.outputs.dom-diff }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go-reservations:
              - 'services/reservations/**'
            go-rates:
              - 'services/rates/**'
            go-reporting:
              - 'services/reporting/**'
            node-stay:
              - 'services/stay/**'
            node-rooms:
              - 'services/rooms/**'
            node-guests:
              - 'services/guests/**'
            node-admin:
              - 'services/admin/**'
            app-shell:
              - 'app/**'
              - 'deploy/nginx/nginx.conf'
              - 'deploy/compose.yaml'
              - 'frontend/*.html'
              - 'script/shell-served-check.sh'
            billing:
              - 'services/billing/**'
            services:
              - 'services/**'
            # DOM-vs-design gate (issue #467): the Playwright
            # assertions compare the seven design boards against the
            # running app DOM, so a change on either side (boards,
            # fact schema, extractor, or the gate itself — the gate
            # sources under app/** are already covered by app-shell)
            # must run the browser-e2e suite.
            design-boards:
              - 'docs/design/**'
            design-facts-harness:
              - 'tests/design-facts/**'
              - 'docs/technical/desk-ui-fact-schema.md'
            # DOM diff gate (issue #481): runs ONLY on FE PRs — the
            # desk UI, the design boards it is diffed against, and
            # the gate's own sources. The app-side gate specs live
            # under app/**, covered by the first pattern.
            dom-diff:
              - 'app/**'
              - 'docs/design/**'
              - 'tests/design-facts/**'
              - 'docs/technical/desk-ui-fact-schema.md'
            contracts:
              - 'contracts/**'
            openapi-docs:
              - 'frontend/docs/**'
            deploy:
              - 'deploy/**'
            scripts:
              - 'script/**'
            workflow:
              - '.github/workflows/**'

      - name: Build job gates from changed areas
        id: gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          GO_RESERVATIONS: ${{ steps.filter.outputs.go-reservations }}
          GO_RATES: ${{ steps.filter.outputs.go-rates }}
          GO_REPORTING: ${{ steps.filter.outputs.go-reporting }}
          NODE_STAY: ${{ steps.filter.outputs.node-stay }}
          NODE_ROOMS: ${{ steps.filter.outputs.node-rooms }}
          NODE_GUESTS: ${{ steps.filter.outputs.node-guests }}
          NODE_ADMIN: ${{ steps.filter.outputs.node-admin }}
          APP_SHELL: ${{ steps.filter.outputs.app-shell }}
          BILLING: ${{ steps.filter.outputs.billing }}
          SERVICES: ${{ steps.filter.outputs.services }}
          CONTRACTS: ${{ steps.filter.outputs.contracts }}
          OPENAPI_DOCS: ${{ steps.filter.outputs.openapi-docs }}
          DEPLOY: ${{ steps.filter.outputs.deploy }}
          SCRIPTS: ${{ steps.filter.outputs.scripts }}
          WORKFLOW: ${{ steps.filter.outputs.workflow }}
          DESIGN_BOARDS: ${{ steps.filter.outputs.design-boards }}
          DESIGN_FACTS: ${{ steps.filter.outputs.design-facts-harness }}
          DOM_DIFF: ${{ steps.filter.outputs.dom-diff }}
        run: |
          python3 - <<'EOF'
          import json
          import os

          e = os.environ
          is_push = e['EVENT_NAME'] == 'push'
          # A workflow change or a push to master runs everything: the
          # gate itself must be verified, and master stays fully green.
          full = is_push or e['WORKFLOW'] == 'true'

          def changed(name):
              return e[name] == 'true'

          go = [m for m, f in (
              ('reservations', 'GO_RESERVATIONS'),
              ('rates', 'GO_RATES'),
              ('reporting', 'GO_REPORTING'),
          ) if full or changed(f)]
          node = [m for m, f in (
              ('stay', 'NODE_STAY'),
              ('rooms', 'NODE_ROOMS'),
              ('guests', 'NODE_GUESTS'),
              ('admin', 'NODE_ADMIN'),
          ) if full or changed(f)]
          # Postgres parity (issue #769): the modules whose suites gate
          # on TEST_PG_URL. A workflow change or a push to master runs
          # every entry; otherwise only the module whose service
          # changed, so a change that touches no service skips the job.
          postgres = [
              {'module': m, 'lang': lang}
              for m, f, lang in (
                  ('reservations', 'GO_RESERVATIONS', 'go'),
                  ('rates', 'GO_RATES', 'go'),
                  ('stay', 'NODE_STAY', 'node'),
                  ('rooms', 'NODE_ROOMS', 'node'),
                  ('guests', 'NODE_GUESTS', 'node'),
                  ('admin', 'NODE_ADMIN', 'node'),
              )
              if full or changed(f)
          ]

          services_changed = full or changed('SERVICES')
          billing = full or changed('BILLING')
          contracts = full or services_changed or changed('CONTRACTS') or changed('SCRIPTS') or changed('OPENAPI_DOCS')
          migrate = full or services_changed or changed('DEPLOY')
          e2e = (full or services_changed or changed('DEPLOY')
                 or changed('SCRIPTS') or changed('CONTRACTS'))
          # Migration shell (issue #291): the /app/ scaffold, its
          # nginx block and compose mount, the legacy pages it must
          # not disturb, and its own served guard.
          shell = full or changed('APP_SHELL')
          # Browser E2E (issue #337): the Playwright Chromium suite
          # over /app/. Contract drift must break the screens loudly,
          # so any services change runs it too. DOM-vs-design gate
          # (issue #467): design-board, fact-schema, or extractor
          # changes re-run it as well, since either side of the
          # comparison may have moved.
          design_changed = full or changed('DESIGN_BOARDS') or changed('DESIGN_FACTS')
          browser_e2e = (full or changed('APP_SHELL') or services_changed or design_changed)
          # DOM diff gate (issue #481): FE-only. Backend-only PRs
          # (services/**, contracts, migrations) match none of the
          # dom-diff patterns, so the job reports SKIPPED and never
          # blocks. Mixed PRs resolve deterministically: any FE-side
          # match runs the gate.
          dom_diff = full or changed('DOM_DIFF')

          def boolean(name, value):
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                  fh.write(f'{name}={"true" if value else "false"}\n')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"go-matrix={json.dumps(go)}\n")
              fh.write(f"node-matrix={json.dumps(node)}\n")
              fh.write(f"postgres-matrix={json.dumps(postgres)}\n")
          boolean('billing', billing)
          boolean('contracts', contracts)
          boolean('migrate', migrate)
          boolean('e2e', e2e)
          boolean('shell', shell)
          boolean('browser-e2e', browser_e2e)
          boolean('dom-diff', dom_diff)

          print(f'event={e["EVENT_NAME"]} full={full}')
          print(f'go={go} node={node} postgres={postgres} billing={billing} '
                f'contracts={contracts} migrate={migrate} e2e={e2e} '
                f'shell={shell} browser_e2e={browser_e2e} '
                f'dom_diff={dom_diff}')
          EOF

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check (script/*.sh)
        run: |
          shopt -s nullglob
          files=(script/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No script/*.sh files found."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Checking $f"
            bash -n "$f"
          done

      - name: Required paths exist
        run: |
          missing=0
          for f in \
            AGENTS.md \
            README.md \
            docs/README.md \
            docs/ao-rules.md \
            docs/project/issue-conventions.md \
            .opencode/opencode.jsonc \
            .github/ISSUE_TEMPLATE/task.yml \
            .github/PULL_REQUEST_TEMPLATE.md; do
            if [ -e "$f" ]; then
              echo "OK $f"
            else
              echo "MISSING $f"
              missing=1
            fi
          done
          exit "$missing"

      - name: No merge-conflict markers in tracked files
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>|\|\|\|\|\|\|\|)' -- .; then
            echo "Merge-conflict markers found."
            exit 1
          fi
          echo "No merge-conflict markers found."

      - name: No secrets-looking strings in tracked files
        # The workflow file itself is excluded: it necessarily contains
        # these patterns as search strings.
        run: |
          if git grep -n -E 'ghp_|gho_|AKIA|-----BEGIN .*PRIVATE KEY' -- . ':!.github/workflows/ci.yml'; then
            echo "Secrets-looking strings found."
            exit 1
          fi
          echo "No secrets-looking strings found."

      - name: Catalogue coverage (NFR-I18N-1, issue #192)
        run: script/catalogue-coverage-check.sh

      - name: Markdown links resolve, no bare section glyphs (issue #378)
        run: script/markdown-link-check.sh

      - name: Pre-flight fail-closed proof (issue #153, no docker needed)
        run: script/test-preflight-fail-closed.sh

      - name: Harness conventions self-check (issue #231)
        run: script/harness-conventions-check.sh

      - name: Harness self-check proves red on a phantom fixture (issue #231)
        run: script/harness-conventions-check.sh --self-test

      - name: Content-verified doc-pin self-test (issues #786, #787)
        run: script/doc-pin-check.test.sh

  doc-pins:
    # Content-verified doc pins (issue #786), BLOCKING since issue #787.
    # Every as-built `path:line` pin must be verified by content, not by
    # number; a pin whose line exists but no longer holds the claimed
    # construct is drift that an existence-only sweep misses. The job runs
    # on every PR and fails on any finding that is not an explicit
    # allow-list row (`script/doc-pin-allowlist.tsv`, one reviewed reason
    # per row). The check reports every allow-listed pin and fails a stale
    # row, so the list can only shrink as the per-doc-set cleanup lands.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Content-verified doc pins (blocking)
        run: |
          set +e
          script/doc-pin-check.sh \
            --keywords script/doc-pin-keywords.tsv \
            --allow script/doc-pin-allowlist.tsv \
            docs/architecture docs/testing docs/requirements \
            > doc-pin-report.txt 2>&1
          status=$?
          cat doc-pin-report.txt
          {
            echo '### Content-verified doc pins (blocking, issue #787)'
            echo ''
            echo '```'
            grep -E '^# (summary|by-target)' doc-pin-report.txt || true
            echo '```'
            echo ''
            echo 'A finding fails this job unless it is an explicit allow-list row.'
            echo 'Allow-listed pins are still reported; a stale row is a finding.'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  go-build:
    needs: changes
    if: needs.changes.outputs.go-matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.go-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build
        working-directory: services/${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: services/${{ matrix.module }}
        run: go vet ./...

      - name: Format check
        working-directory: services/${{ matrix.module }}
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Test
        working-directory: services/${{ matrix.module }}
        run: go test ./...

  node-build:
    needs: changes
    if: needs.changes.outputs.node-matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.node-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/${{ matrix.module }}/package-lock.json

      - name: Install
        working-directory: services/${{ matrix.module }}
        run: npm ci

      - name: Build
        working-directory: services/${{ matrix.module }}
        run: npm run build

      - name: Lint
        working-directory: services/${{ matrix.module }}
        run: npm run lint

      - name: Test
        working-directory: services/${{ matrix.module }}
        run: npm test

  app-build:
    # Desk UI (issue #291, NFR-SHL-1; legacy pages decommissioned in
    # #299): Node 22 + npm ci + build + lint + test over app/, then
    # the served-shell guard (placeholder, fallback, print
    # namespace, cutover redirects, mirror).
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Test
        working-directory: app
        run: npm test

      - name: Served-shell guard (placeholder, fallback, redirects, mirror)
        run: script/shell-served-check.sh

  billing-build:
    needs: changes
    if: needs.changes.outputs.billing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package (includes unit tests)
        working-directory: services/billing
        run: mvn -B package

  contract-check:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Repo contract gate
        run: script/contract-check.sh

  migrate-check:
    needs: changes
    if: needs.changes.outputs.migrate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: hotel
      PGUSER: hotel
      PGPASSWORD: hotel
    steps:
      - uses: actions/checkout@v4

      - name: Apply every module boot migration against scratch PostgreSQL
        run: |
          set -euo pipefail
          for f in \
            services/reservations/migrations/*.up.sql \
            services/rates/migrations/*.up.sql \
            services/reporting/migrations/*.up.sql \
            services/stay/migrations/*.sql \
            services/rooms/migrations/*.sql \
            services/guests/migrations/*.sql \
            services/admin/migrations/*.sql \
            services/billing/src/main/resources/db/migration/V*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "All boot migrations applied."

  postgres-parity:
    # Postgres parity suites (issue #769): the covered modules run
    # against a fresh postgres:16 service with that module's
    # migrations applied and TEST_PG_URL exported. A workflow change
    # or a push to master runs every covered module; otherwise only
    # the modules whose service changed. The skip guard fails the job
    # when a suite still reports skipped cases, so a green run proves
    # the Postgres stores were exercised instead of skipped.
    needs: changes
    if: needs.changes.outputs.postgres-matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.postgres-matrix) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: hotel
      PGUSER: hotel
      PGPASSWORD: hotel
      TEST_PG_URL: postgresql://hotel:hotel@127.0.0.1:5432/hotel
    steps:
      - uses: actions/checkout@v4

      - name: Apply this module's migrations to the scratch database
        working-directory: services/${{ matrix.module }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.lang }}" = "go" ]; then
            files=$(ls migrations/*.up.sql | sort -V)
          else
            files=$(ls migrations/*.sql | sort -V)
          fi
          for f in $files; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-node@v4
        if: matrix.lang == 'node'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/${{ matrix.module }}/package-lock.json

      - name: Install
        if: matrix.lang == 'node'
        working-directory: services/${{ matrix.module }}
        run: npm ci

      - name: Build
        if: matrix.lang == 'node'
        working-directory: services/${{ matrix.module }}
        run: npm run build

      - name: Test with TEST_PG_URL set
        working-directory: services/${{ matrix.module }}
        run: |
          set -euo pipefail
          test -n "${TEST_PG_URL:-}"
          if [ "${{ matrix.lang }}" = "go" ]; then
            go test -json ./... | tee "$RUNNER_TEMP/pg-parity.json"
          else
            node --test --test-concurrency=1 --test-reporter=tap "dist/**/*.test.js" \
              | tee "$RUNNER_TEMP/pg-parity.tap"
          fi

      - name: Fail on a silently skipped Postgres suite (suite or test level)
        if: always()
        run: |
          python3 - "${{ matrix.lang }}" "$RUNNER_TEMP" <<'PY'
          import json
          import os
          import re
          import sys

          lang, temp = sys.argv[1], sys.argv[2]
          if lang == "go":
              path = os.path.join(temp, "pg-parity.json")
              if not os.path.exists(path):
                  print("::error::the Go test step produced no JSON output")
                  sys.exit(1)
              passed = skipped = failed = 0
              postgres_passed = 0
              with open(path, encoding="utf-8", errors="replace") as fh:
                  for line in fh:
                      line = line.strip()
                      if not line.startswith("{"):
                          continue
                      try:
                          event = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if not event.get("Test"):
                          continue
                      action = event.get("Action")
                      if action == "pass":
                          passed += 1
                          if "postgres" in event["Test"].lower():
                              postgres_passed += 1
                      elif action == "skip":
                          skipped += 1
                      elif action == "fail":
                          failed += 1
              tests = passed + skipped + failed
          else:
              path = os.path.join(temp, "pg-parity.tap")
              if not os.path.exists(path):
                  print("::error::the Node test step produced no TAP output")
                  sys.exit(1)
              with open(path, encoding="utf-8", errors="replace") as fh:
                  text = fh.read()

              def count(name):
                  found = re.findall(r"^# %s (\d+)$" % name, text, re.MULTILINE)
                  return int(found[-1]) if found else 0

              tests = count("tests")
              passed = count("pass")
              failed = count("fail")
              # A skipped `describe(..., { skip })` is reported as a
              # suite line (`ok N - <name> # SKIP`), not as a test:
              # Node's TAP summary leaves it out of `# skipped` and
              # out of `# tests`. Count those directives directly so
              # the whole Postgres block cannot silently disappear.
              skip_directives = re.findall(
                  r"^\s*(?:not )?ok \d+ - .*# SKIP\s*$",
                  text,
                  re.MULTILINE,
              )
              skipped = max(count("skipped"), len(skip_directives))
              # The module also runs in-memory suites, so a non-zero
              # total does not prove the Postgres half ran. Require at
              # least one executed top-level suite whose name names
              # Postgres (they all do, e.g. "rooms postgres store").
              postgres_passed = len(
                  re.findall(
                      r"^(?:ok|not ok) \d+ - .*postgres.*$",
                      text,
                      re.MULTILINE | re.IGNORECASE,
                  )
              )

          line = (
              f"{lang}: tests={tests} passed={passed} "
              f"failed={failed} skipped={skipped} "
              f"postgres_suites={postgres_passed}"
          )
          print(line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"- {line}\n")

          if failed:
              print(f"::error::{lang} parity suite reported {failed} failing case(s)")
              sys.exit(1)
          if skipped:
              print(
                  f"::error::{lang} parity suite reported {skipped} skipped case(s) "
                  "with TEST_PG_URL set; the Postgres path is not gated"
              )
              sys.exit(1)
          if passed == 0:
              print(f"::error::{lang} parity suite executed zero cases")
              sys.exit(1)
          if postgres_passed == 0:
              print(
                  f"::error::{lang} parity suite executed no Postgres-named "
                  "case; check that the Postgres suite still exists and ran"
              )
              sys.exit(1)
          PY

  e2e-single-host:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    # Walking-skeleton proof for issue #113: fresh container-lab
    # bring-up from docs only, then the desk loop end to end
    # (book -> verify -> backup -> restore -> verify) through the
    # proxy. GitHub-hosted runners provide the docker host the
    # lab needs; the per-sale secrets below are throwaway CI-only
    # values (non-default so the fail-closed gates pass).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_PASSWORD: e2e-ci-db-secret-7q2x
      ADMIN_BOOT_SECRET: e2e-ci-owner-boot-9m4z
      ADMIN_TOKEN_KEY: e2e-ci-token-key-3f8v
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the per-hotel configuration set
        run: |
          set -euo pipefail
          cp deploy/config/hotel.example.json deploy/config/hotel.json
          sed -i 's/EXAMPLE-001/E2E-CI-001/' deploy/config/hotel.json
          grep -q "E2E-CI-001" deploy/config/hotel.json

      - name: Validate the proxy configuration (fails fast on emerg-class faults)
        # nginx -t resolves upstream hostnames at config-test time;
        # the loopback stubs satisfy resolution (reachability is
        # proven later by the loop itself through the real network).
        run: >
          docker run --rm
          -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          --add-host reservations:127.0.0.1 --add-host rates:127.0.0.1
          --add-host reporting:127.0.0.1 --add-host stay:127.0.0.1
          --add-host rooms:127.0.0.1 --add-host guests:127.0.0.1
          --add-host billing:127.0.0.1 --add-host admin:127.0.0.1
          nginx:1.27-alpine nginx -t

      - name: One-hotel installer end to end (issue #153)
        # script/install.sh sequences the same gates (pre-flight, then
        # the desk-loop proof with backup and restore drill, stack left
        # up), so CI proves the installer path itself on every run.
        run: script/install.sh --config deploy/config/hotel.json --staging-dir ./backup-staging

      - name: Timed desk checks (NFR-PERF-1, CI variant, issue #182)
        # The lab is still up from the installer step. This records the
        # named view/action timings as a ci-e2e-variant (never compared
        # against single-host bounds); the numbers feed
        # docs/testing/test-report.md.
        run: script/e2e-perf-check.sh --base-url http://127.0.0.1

      - name: Show the backup and restore-drill reports
        if: always()
        run: |
          ls backup-staging/ || true
          cat backup-staging/*.report.json || true

      - name: Tear down the lab
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  browser-e2e:
    needs: changes
    if: needs.changes.outputs.browser-e2e == 'true'
    # Playwright browser E2E for issue #337 (plan
    # docs/testing/browser-e2e-plan.md): Chromium over the served Vue
    # SPA (/app/*), proving what the API loop cannot — sign-in,
    # booking, moves, charges, checkout, and print render and refuse
    # loudly on screen. Same installer bring-up as e2e-single-host so
    # the stack under test is identical; bring-up is re-run in-job
    # (no cross-job stack handoff) and the lab is torn down after.
    # Browsers install in a dedicated pre-baked step (cached on the
    # lockfile hash), never lazily at test time; the runner host also
    # runs the compose lab, so the default runner image is used
    # instead of the Playwright image (no Docker-in-Docker). The
    # per-sale secrets below are throwaway CI-only values
    # (non-default so the fail-closed gates pass).
    #
    # DOM-vs-design gate (issue #467): the design-facts specs in this
    # same suite compare the six design boards against the running app
    # DOM (computed styles, no screenshots). The extractor runs here
    # first so the specs always read fresh, byte-identical records;
    # DESIGN_FACTS_DIR points the specs at them. The full-tree DOM
    # diff spec (issue #481) is excluded here — it runs in the
    # dedicated dom-diff job on FE PRs only.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_PASSWORD: e2e-ci-db-secret-7q2x
      ADMIN_BOOT_SECRET: e2e-ci-owner-boot-9m4z
      ADMIN_TOKEN_KEY: e2e-ci-token-key-3f8v
      DESIGN_FACTS_DIR: /tmp/design-facts
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the per-hotel configuration set
        run: |
          set -euo pipefail
          cp deploy/config/hotel.example.json deploy/config/hotel.json
          sed -i 's/EXAMPLE-001/E2E-CI-001/' deploy/config/hotel.json
          grep -q "E2E-CI-001" deploy/config/hotel.json

      - name: One-hotel installer end to end (issue #153)
        # Same stack as e2e-single-host: pre-flight, desk-loop proof
        # with backup and restore drill, stack left up for the suite.
        run: script/install.sh --config deploy/config/hotel.json --staging-dir ./backup-staging

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build the desk shell
        working-directory: app
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (pre-baked, never at test time)
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Extract design UI facts (issue #467, deterministic UTF-8 JSON only)
        # Fresh records every run: the design-facts specs refuse to run
        # without them (DESIGN_FACTS_DIR) and refuse schema drift.
        run: node tests/design-facts/extract-design-facts.mjs --out "$DESIGN_FACTS_DIR"

      - name: Zero-binary-artifact guard for the DOM-vs-design gate (issue #467)
        # The gate asserts through the DOM and computed styles only.
        # This fails closed if screenshot, video, or snapshot APIs
        # ever enter the gate sources (prose mentions do not match:
        # only API-shape patterns are grepped).
        working-directory: app
        run: |
          if grep -RInE 'toHaveScreenshot|toMatchSnapshot|page\.screenshot|screenshot:|video:' e2e/design-facts.ts e2e/design-facts.spec.ts; then
            echo 'The DOM-vs-design gate must not capture screenshots, video, or snapshots.'
            exit 1
          fi

      - name: Playwright browser E2E (Chromium, issue #337)
        working-directory: app
        run: |
          # DOM diff gate (issue #481) runs in the dedicated dom-diff
          # job on FE PRs only — exclude it here so backend-only PRs
          # never execute it and mixed PRs never run it twice.
          # The '|| true' keeps the step green under 'bash -e' if the
          # suite ever shrinks to only the dom-diff spec (grep -v
          # exits 1 when it selects nothing).
          specs=$(ls e2e/*.spec.ts | grep -v 'e2e/dom-diff.spec.ts' || true | tr '\n' ' ')
          npx playwright test --project=chromium $specs

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          if-no-files-found: warn

      - name: Tear down the lab
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  dom-diff:
    needs: changes
    if: needs.changes.outputs.dom-diff == 'true'
    # Full-tree DOM diff gate (issue #481): the owner design HTML
    # files diffed against the running desk UI
    # (app/e2e/dom-diff.spec.ts, text-only, no screenshots). Runs
    # ONLY on FE PRs — the paths-filter limits triggers to app/**,
    # docs/design/**, and gate files, so backend-only PRs report
    # SKIPPED and never block. Same installer bring-up as
    # browser-e2e (the live extraction tests sign in against the
    # real lab stack); only the dom-diff spec runs here, and
    # browser-e2e excludes it, so the gate executes in exactly one
    # place.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_PASSWORD: e2e-ci-db-secret-7q2x
      ADMIN_BOOT_SECRET: e2e-ci-owner-boot-9m4z
      ADMIN_TOKEN_KEY: e2e-ci-token-key-3f8v
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the per-hotel configuration set
        run: |
          set -euo pipefail
          cp deploy/config/hotel.example.json deploy/config/hotel.json
          sed -i 's/EXAMPLE-001/E2E-CI-001/' deploy/config/hotel.json
          grep -q "E2E-CI-001" deploy/config/hotel.json

      - name: One-hotel installer end to end (issue #153)
        # Same stack as e2e-single-host: pre-flight, desk-loop proof
        # with backup and restore drill, stack left up for the suite.
        run: script/install.sh --config deploy/config/hotel.json --staging-dir ./backup-staging

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build the desk shell
        working-directory: app
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (pre-baked, never at test time)
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Zero-binary-artifact guard for the DOM diff gate (issue #481)
        # The gate asserts through the DOM and computed styles only.
        # This fails closed if screenshot, video, or snapshot APIs
        # ever enter the gate sources (prose mentions do not match:
        # only API-shape patterns are grepped).
        working-directory: app
        run: |
          if grep -RInE 'toHaveScreenshot|toMatchSnapshot|page\.screenshot|screenshot:|video:' e2e/dom-diff.ts e2e/dom-diff.spec.ts; then
            echo 'The DOM diff gate must not capture screenshots, video, or snapshots.'
            exit 1
          fi

      - name: Playwright DOM diff gate (Chromium, issue #481)
        working-directory: app
        run: npx playwright test --project=chromium e2e/dom-diff.spec.ts

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dom-diff
          path: app/playwright-report/
          if-no-files-found: warn

      - name: Tear down the lab
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  perf-reporting-variant:
    # NFR-PERF-2 timing record (issue #182): two years of 50-room data
    # rebuilt in-process, each standard report timed with -v so the
    # PERF lines land in the job log for docs/testing/test-report.md.
    # CI runners are variants (never compared against single-host
    # bounds); the bound assertion engages only with REFERENCE_HOST=1.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PERF_ENV_LABEL: ci-e2e-variant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Runner facts for the test-report environment label
        run: |
          nproc
          grep MemTotal /proc/meminfo
          df -h /tmp | tail -1

      - name: Rebuild two years of 50-room data and time the standard reports
        working-directory: services/reporting
        run: go test -v -run 'TestPerfTwoYearReportsRecordTimings' ./internal/service/
