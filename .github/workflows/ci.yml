name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files via the API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter (issue #120): decides which heavy jobs a change needs.
  # Always runs. Docs-only changes (docs/**, template/**, markdown,
  # issue/PR templates) match no code filter below, so every heavy job
  # is skipped and the PR is gated on the metadata `ci` job alone.
  # A change to this workflow file (or a push to master) runs the full
  # matrix, so no PR can go green without its required checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go-matrix: ${{ steps.gates.outputs.go-matrix }}
      node-matrix: ${{ steps.gates.outputs.node-matrix }}
      billing: ${{ steps.gates.outputs.billing }}
      contracts: ${{ steps.gates.outputs.contracts }}
      migrate: ${{ steps.gates.outputs.migrate }}
      e2e: ${{ steps.gates.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go-reservations:
              - 'services/reservations/**'
            go-rates:
              - 'services/rates/**'
            go-reporting:
              - 'services/reporting/**'
            node-stay:
              - 'services/stay/**'
            node-rooms:
              - 'services/rooms/**'
            node-guests:
              - 'services/guests/**'
            node-admin:
              - 'services/admin/**'
            billing:
              - 'services/billing/**'
            services:
              - 'services/**'
            contracts:
              - 'contracts/**'
            deploy:
              - 'deploy/**'
            scripts:
              - 'script/**'
            workflow:
              - '.github/workflows/**'

      - name: Build job gates from changed areas
        id: gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          GO_RESERVATIONS: ${{ steps.filter.outputs.go-reservations }}
          GO_RATES: ${{ steps.filter.outputs.go-rates }}
          GO_REPORTING: ${{ steps.filter.outputs.go-reporting }}
          NODE_STAY: ${{ steps.filter.outputs.node-stay }}
          NODE_ROOMS: ${{ steps.filter.outputs.node-rooms }}
          NODE_GUESTS: ${{ steps.filter.outputs.node-guests }}
          NODE_ADMIN: ${{ steps.filter.outputs.node-admin }}
          BILLING: ${{ steps.filter.outputs.billing }}
          SERVICES: ${{ steps.filter.outputs.services }}
          CONTRACTS: ${{ steps.filter.outputs.contracts }}
          DEPLOY: ${{ steps.filter.outputs.deploy }}
          SCRIPTS: ${{ steps.filter.outputs.scripts }}
          WORKFLOW: ${{ steps.filter.outputs.workflow }}
        run: |
          python3 - <<'EOF'
          import json
          import os

          e = os.environ
          is_push = e['EVENT_NAME'] == 'push'
          # A workflow change or a push to master runs everything: the
          # gate itself must be verified, and master stays fully green.
          full = is_push or e['WORKFLOW'] == 'true'

          def changed(name):
              return e[name] == 'true'

          go = [m for m, f in (
              ('reservations', 'GO_RESERVATIONS'),
              ('rates', 'GO_RATES'),
              ('reporting', 'GO_REPORTING'),
          ) if full or changed(f)]
          node = [m for m, f in (
              ('stay', 'NODE_STAY'),
              ('rooms', 'NODE_ROOMS'),
              ('guests', 'NODE_GUESTS'),
              ('admin', 'NODE_ADMIN'),
          ) if full or changed(f)]

          services_changed = full or changed('SERVICES')
          billing = full or changed('BILLING')
          contracts = full or services_changed or changed('CONTRACTS') or changed('SCRIPTS')
          migrate = full or services_changed or changed('DEPLOY')
          e2e = (full or services_changed or changed('DEPLOY')
                 or changed('SCRIPTS') or changed('CONTRACTS'))

          def boolean(name, value):
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                  fh.write(f'{name}={"true" if value else "false"}\n')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"go-matrix={json.dumps(go)}\n")
              fh.write(f"node-matrix={json.dumps(node)}\n")
          boolean('billing', billing)
          boolean('contracts', contracts)
          boolean('migrate', migrate)
          boolean('e2e', e2e)

          print(f'event={e["EVENT_NAME"]} full={full}')
          print(f'go={go} node={node} billing={billing} '
                f'contracts={contracts} migrate={migrate} e2e={e2e}')
          EOF

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check (script/*.sh)
        run: |
          shopt -s nullglob
          files=(script/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No script/*.sh files found."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Checking $f"
            bash -n "$f"
          done

      - name: Required paths exist
        run: |
          missing=0
          for f in \
            AGENTS.md \
            README.md \
            docs/README.md \
            docs/ao-rules.md \
            docs/project/issue-conventions.md \
            .opencode/opencode.jsonc \
            .github/ISSUE_TEMPLATE/task.yml \
            .github/PULL_REQUEST_TEMPLATE.md; do
            if [ -e "$f" ]; then
              echo "OK $f"
            else
              echo "MISSING $f"
              missing=1
            fi
          done
          exit "$missing"

      - name: No merge-conflict markers in tracked files
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>|\|\|\|\|\|\|\|)' -- .; then
            echo "Merge-conflict markers found."
            exit 1
          fi
          echo "No merge-conflict markers found."

      - name: No secrets-looking strings in tracked files
        # The workflow file itself is excluded: it necessarily contains
        # these patterns as search strings.
        run: |
          if git grep -n -E 'ghp_|gho_|AKIA|-----BEGIN .*PRIVATE KEY' -- . ':!.github/workflows/ci.yml'; then
            echo "Secrets-looking strings found."
            exit 1
          fi
          echo "No secrets-looking strings found."

  go-build:
    needs: changes
    if: needs.changes.outputs.go-matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.go-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build
        working-directory: services/${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: services/${{ matrix.module }}
        run: go vet ./...

      - name: Format check
        working-directory: services/${{ matrix.module }}
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Test
        working-directory: services/${{ matrix.module }}
        run: go test ./...

  node-build:
    needs: changes
    if: needs.changes.outputs.node-matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.node-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/${{ matrix.module }}/package-lock.json

      - name: Install
        working-directory: services/${{ matrix.module }}
        run: npm ci

      - name: Build
        working-directory: services/${{ matrix.module }}
        run: npm run build

      - name: Lint
        working-directory: services/${{ matrix.module }}
        run: npm run lint

      - name: Test
        working-directory: services/${{ matrix.module }}
        run: npm test

  billing-build:
    needs: changes
    if: needs.changes.outputs.billing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package (includes unit tests)
        working-directory: services/billing
        run: mvn -B package

  contract-check:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Repo contract gate
        run: script/contract-check.sh

  migrate-check:
    needs: changes
    if: needs.changes.outputs.migrate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: hotel
      PGUSER: hotel
      PGPASSWORD: hotel
    steps:
      - uses: actions/checkout@v4

      - name: Apply every module boot migration against scratch PostgreSQL
        run: |
          set -euo pipefail
          for f in \
            services/reservations/migrations/*.up.sql \
            services/rates/migrations/*.up.sql \
            services/reporting/migrations/*.up.sql \
            services/stay/migrations/*.sql \
            services/rooms/migrations/*.sql \
            services/guests/migrations/*.sql \
            services/admin/migrations/*.sql \
            services/billing/src/main/resources/db/migration/V*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "All boot migrations applied."

  e2e-single-host:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    # Walking-skeleton proof for issue #113: fresh container-lab
    # bring-up from docs only, then the desk loop end to end
    # (book -> verify -> backup -> restore -> verify) through the
    # proxy. GitHub-hosted runners provide the docker host the
    # lab needs; the per-sale secrets below are throwaway CI-only
    # values (non-default so the fail-closed gates pass).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_PASSWORD: e2e-ci-db-secret-7q2x
      ADMIN_BOOT_SECRET: e2e-ci-owner-boot-9m4z
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the per-hotel configuration set
        run: |
          set -euo pipefail
          cp deploy/config/hotel.example.json deploy/config/hotel.json
          sed -i 's/EXAMPLE-001/E2E-CI-001/' deploy/config/hotel.json
          grep -q "E2E-CI-001" deploy/config/hotel.json

      - name: Validate the proxy configuration (fails fast on emerg-class faults)
        # nginx -t resolves upstream hostnames at config-test time;
        # the loopback stubs satisfy resolution (reachability is
        # proven later by the loop itself through the real network).
        run: >
          docker run --rm
          -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          --add-host reservations:127.0.0.1 --add-host rates:127.0.0.1
          --add-host reporting:127.0.0.1 --add-host stay:127.0.0.1
          --add-host rooms:127.0.0.1 --add-host guests:127.0.0.1
          --add-host billing:127.0.0.1 --add-host admin:127.0.0.1
          nginx:1.27-alpine nginx -t

      - name: Pre-flight gate (fails closed on default secrets)
        run: script/preflight.sh --config deploy/config/hotel.json

      - name: Desk loop E2E (book -> verify -> backup -> restore -> verify)
        run: script/e2e-desk-loop.sh --staging-dir ./backup-staging

      - name: Show the backup success report
        if: always()
        run: |
          ls backup-staging/ || true
          cat backup-staging/*.report.json || true

      - name: Tear down the lab
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
