<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-msg="desk.today.title">Hotel Management — Desk Today</title>
</head>
<body>
  <h1 data-msg="desk.today.title">Hotel Management — Desk Today</h1>
  <p><a href="/" data-msg="desk.today.back">Back to the desk entry</a></p>
  <noscript><p>This page needs JavaScript to sign in and load today's lists.</p></noscript>

  <section id="signin-section">
    <h2 data-msg="desk.admin.sign_in">Sign in</h2>
    <form id="signin-form">
      <label data-msg="desk.admin.signin_identity">Sign-in identity: <input id="signin-identity" name="signin-identity" autocomplete="username"></label>
      <label data-msg="desk.admin.secret">Secret: <input id="signin-secret" name="signin-secret" type="password" autocomplete="current-password"></label>
      <button type="submit" data-msg="desk.admin.sign_in">Sign in</button>
    </form>
    <p id="signin-error" role="alert" hidden></p>
  </section>

  <section id="dashboard-section" hidden>
    <p><span data-msg="desk.admin.signed_in_as">Signed in as </span><strong id="whoami"></strong> (<span id="myrole"></span>).
      <button id="signout-button" type="button" data-msg="desk.admin.signout">Sign out</button></p>
    <p><span data-msg="desk.today.business_date">Business date: </span><strong id="business-date"></strong>
      <button id="refresh-button" type="button" data-msg="desk.today.refresh">Refresh</button></p>
    <p id="dashboard-status" data-msg="desk.today.loading">Loading today’s lists…</p>
    <p id="dashboard-error" role="alert" hidden></p>
    <p id="sheet-line"></p>

    <h2 data-msg="desk.today.arrivals">Arriving today</h2>
    <table id="arrivals-table">
      <thead>
        <tr><th data-msg="desk.today.th_guest">Guest</th><th data-msg="desk.today.th_room">Room</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2 data-msg="desk.today.in_house">In house</h2>
    <table id="inhouse-table">
      <thead>
        <tr><th data-msg="desk.today.th_guest">Guest</th><th data-msg="desk.today.th_room">Room</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2 data-msg="desk.today.departures">Leaving today</h2>
    <table id="departures-table">
      <thead>
        <tr><th data-msg="desk.today.th_guest">Guest</th><th data-msg="desk.today.th_room">Room</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2 data-msg="desk.today.attention">Rooms needing attention</h2>
    <h3 data-msg="desk.today.dirty">Dirty</h3>
    <ul id="dirty-list"></ul>
    <h3 data-msg="desk.today.uninspected">Clean but uninspected</h3>
    <ul id="uninspected-list"></ul>
    <h3 data-msg="desk.today.out_of_order">Out of order</h3>
    <ul id="outoforder-list"></ul>
  </section>

  <script src="messages.js"></script>
  <script>
    DeskMessages.init();
    // Desk today dashboard (issue #249): sign-in plus the read-only
    // morning view — arrivals, in-house stays, departures, and the
    // rooms needing housekeeping attention. Same static pattern as
    // the admin console (frontend/admin.html): no build step, the
    // page calls the versioned contract paths through Nginx on this
    // host. Read-only: SignIn plus ListArrivalsDepartures,
    // ListRoomsByState, and DailySheet for the cross-check counts.
    // Guest names resolve through the existing GetGuest read; room
    // and room-type references stay as IDs because no existing read
    // maps them to numbers or names (flagged in the PR).
    (function () {
      var token = null;

      function pad(value) {
        return (value < 10 ? "0" : "") + value;
      }

      function businessDate() {
        var now = new Date();
        return now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
      }

      function show(id, message) {
        var el = document.getElementById(id);
        el.textContent = message;
        el.hidden = !message;
      }

      async function call(operation, body) {
        var routes = {
          SignIn: "/v1/admin/SignIn",
          SignOut: "/v1/admin/SignOut",
          ListArrivalsDepartures: "/v1/stay/ListArrivalsDepartures",
          ListRoomsByState: "/v1/rooms/ListRoomsByState",
          DailySheet: "/v1/reporting/DailySheet",
          GetGuest: "/v1/guests/GetGuest",
        };
        var headers = { "Content-Type": "application/json" };
        if (token) {
          headers["Authorization"] = "Bearer " + token;
        }
        var response = await fetch(routes[operation], {
          method: "POST",
          headers: headers,
          body: JSON.stringify(body || {}),
        });
        var payload = await response.json();
        if (!response.ok) {
          var failure = new Error(payload.message || payload.code || DeskMessages.msg("desk.admin.request_failed", { operation: operation }, "request failed: {operation}"));
          failure.code = payload.code;
          throw failure;
        }
        return payload;
      }

      function esc(value) {
        return String(value).replace(/[&<>"']/g, function (ch) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
        });
      }

      function isSignedOut(err) {
        return err && err.code === "UNAUTHENTICATED";
      }

      async function resolveGuestName(guestId) {
        if (!guestId) {
          return DeskMessages.msg("desk.today.unknown_guest", { guestId: guestId }, "Unknown guest ({guestId})");
        }
        try {
          var guest = await call("GetGuest", { guestId: guestId });
          return guest.fullName || String(guestId);
        } catch (err) {
          if (isSignedOut(err)) {
            throw err;
          }
          return DeskMessages.msg("desk.today.unknown_guest", { guestId: guestId }, "Unknown guest ({guestId})");
        }
      }

      function roomLabel(stay) {
        var roomRef = stay.currentRoomId || stay.roomId || "";
        if (!roomRef) {
          return DeskMessages.msg("desk.today.not_assigned", {}, "Not assigned");
        }
        return DeskMessages.msg("desk.today.room_ref", { roomRef: roomRef }, "Room {roomRef}");
      }

      async function renderStays(tableId, stays) {
        var rows = await Promise.all(stays.map(async function (stay) {
          var name = await resolveGuestName(stay.guestId);
          return "<tr><td>" + esc(name) + "</td><td>" + esc(roomLabel(stay)) + "</td></tr>";
        }));
        document.querySelector("#" + tableId + " tbody").innerHTML = rows.join("") ||
          '<tr><td colspan="2">' + esc(DeskMessages.msg("desk.admin.no_entries", {}, "No entries yet.")) + "</td></tr>";
      }

      function renderAttention(listId, rooms) {
        var items = rooms.map(function (room) {
          return "<li>" + esc(room.number) + " — " +
            esc(DeskMessages.msg("desk.today.room_type", { roomType: room.roomTypeId }, "Room type {roomType}")) + "</li>";
        });
        document.getElementById(listId).innerHTML = items.join("") ||
          "<li>" + esc(DeskMessages.msg("desk.admin.no_entries", {}, "No entries yet.")) + "</li>";
      }

      async function refreshDashboard() {
        var date = businessDate();
        document.getElementById("business-date").textContent = date;
        document.getElementById("dashboard-status").hidden = false;
        show("dashboard-error", "");
        try {
          var lists = await call("ListArrivalsDepartures", { businessDate: date });
          await renderStays("arrivals-table", lists.arrivals || []);
          await renderStays("inhouse-table", lists.inHouse || []);
          await renderStays("departures-table", lists.departures || []);
          var dirty = await call("ListRoomsByState", { state: "vacant-dirty" });
          renderAttention("dirty-list", dirty.rooms || []);
          var clean = await call("ListRoomsByState", { state: "vacant-clean" });
          renderAttention("uninspected-list", clean.rooms || []);
          var blocked = await call("ListRoomsByState", { state: "out-of-order" });
          renderAttention("outoforder-list", blocked.rooms || []);
          var sheet = await call("DailySheet", { businessDate: date });
          document.getElementById("sheet-line").textContent = DeskMessages.msg("desk.today.sheet_line", {
            arrivals: (sheet.arrivals || []).length,
            inHouse: (sheet.inHouse || []).length,
            departures: (sheet.departures || []).length,
            openBalances: (sheet.openBalances || []).length,
            asOf: sheet.asOf || "",
          }, "{arrivals} arriving, {inHouse} in house, {departures} leaving, {openBalances} open balances (as of {asOf}).");
          document.getElementById("dashboard-status").hidden = true;
        } catch (err) {
          document.getElementById("dashboard-status").hidden = true;
          if (isSignedOut(err)) {
            signOutLocal();
            show("signin-error", DeskMessages.msg("desk.today.session_expired", {}, "Session expired. Sign in again."));
            return;
          }
          show("dashboard-error", err.message);
        }
      }

      function signOutLocal() {
        token = null;
        document.getElementById("dashboard-section").hidden = true;
        document.getElementById("signin-section").hidden = false;
        document.getElementById("signin-secret").value = "";
      }

      document.getElementById("signin-form").addEventListener("submit", async function (event) {
        event.preventDefault();
        try {
          var payload = await call("SignIn", {
            signinIdentity: document.getElementById("signin-identity").value,
            secret: document.getElementById("signin-secret").value,
          });
          token = payload.token;
          document.getElementById("whoami").textContent = payload.displayName;
          document.getElementById("myrole").textContent = payload.role;
          document.getElementById("signin-section").hidden = true;
          document.getElementById("dashboard-section").hidden = false;
          show("signin-error", "");
          await refreshDashboard();
        } catch (err) {
          show("signin-error", err.message);
        }
      });

      document.getElementById("refresh-button").addEventListener("click", async function () {
        await refreshDashboard();
      });

      document.getElementById("signout-button").addEventListener("click", async function () {
        try {
          await call("SignOut", {});
        } catch (err) {
          /* A dead token signs out locally all the same. */
        }
        signOutLocal();
      });
    })();
  </script>
</body>
</html>
