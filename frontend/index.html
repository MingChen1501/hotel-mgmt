<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Management — Desk Entry</title>
</head>
<body>
  <h1>Hotel Management — Desk Entry</h1>
  <p>Served by Nginx. Desk screens land in later slices; this page only
  proves the entry point is up.</p>
  <h2>Backup report</h2>
  <p id="backup-report">Loading the latest backup report…</p>
  <p id="backup-support" hidden></p>
  <noscript><p>No recent backup report — treat as failed. Note this
  message word for word and call support the same day (runbook
  section 6).</p></noscript>
  <script>
    // Desk surface for the newest backup report (issue #116).
    // script/publish-backup-report.sh renders backup-report.json
    // beside this page after every backup run, in the runbook
    // section 2 wording. A missing file means no recent report,
    // which counts as failed (runbook section 1).
    (function () {
      var line = document.getElementById("backup-report");
      var support = document.getElementById("backup-support");
      function showFailure(text) {
        line.textContent = text;
        support.textContent = "Note this message word for word and call " +
          "support the same day (runbook section 6).";
        support.hidden = false;
      }
      fetch("backup-report.json", { cache: "no-store" })
        .then(function (response) {
          if (!response.ok) {
            throw new Error("no report");
          }
          return response.json();
        })
        .then(function (report) {
          if (!report || typeof report.line !== "string" || !report.line) {
            throw new Error("bad report");
          }
          line.textContent = report.line;
          if (report.outcome === "failure") {
            support.textContent = typeof report.support === "string" && report.support
              ? report.support
              : "Note this message word for word and call support the same day " +
                "(runbook section 6).";
            support.hidden = false;
          }
        })
        .catch(function () {
          showFailure("No recent backup report — treat as failed.");
        });
    })();
  </script>
  <h2>Module health</h2>
  <ul>
    <li><a href="/v1/reservations/healthz">reservations</a></li>
    <li><a href="/v1/rates/healthz">rates</a></li>
    <li><a href="/v1/reporting/healthz">reporting</a></li>
    <li><a href="/v1/stay/healthz">stay</a></li>
    <li><a href="/v1/rooms/healthz">rooms</a></li>
    <li><a href="/v1/guests/healthz">guests</a></li>
    <li><a href="/v1/billing/healthz">billing</a></li>
    <li><a href="/v1/admin/healthz">admin</a></li>
  </ul>
</body>
</html>
