<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-msg="desk.folio.title">Hotel Management — Desk Folio</title>
</head>
<body>
  <h1 data-msg="desk.folio.title">Hotel Management — Desk Folio</h1>
  <p><a href="/" data-msg="desk.folio.back">Back to the desk entry</a> ·
    <a href="/desk.html" data-msg="desk.folio.today_link">Today's arrivals, in-house, and departures</a> ·
    <a href="/stay.html" data-msg="desk.folio.stay_link">Stay check-in, move, and check-out</a></p>
  <noscript><p>This page needs JavaScript to sign in and open a folio.</p></noscript>

  <section id="signin-section">
    <h2 data-msg="desk.admin.sign_in">Sign in</h2>
    <form id="signin-form">
      <label data-msg="desk.admin.signin_identity">Sign-in identity: <input id="signin-identity" name="signin-identity" autocomplete="username"></label>
      <label data-msg="desk.admin.secret">Secret: <input id="signin-secret" name="signin-secret" type="password" autocomplete="current-password"></label>
      <button type="submit" data-msg="desk.admin.sign_in">Sign in</button>
    </form>
    <p id="signin-error" role="alert" hidden></p>
  </section>

  <section id="folio-section" hidden>
    <p><span data-msg="desk.admin.signed_in_as">Signed in as </span><strong id="whoami"></strong> (<span id="myrole"></span>).
      <button id="signout-button" type="button" data-msg="desk.admin.signout">Sign out</button></p>

    <h2 data-msg="desk.folio.open_heading">Open a stay folio</h2>
    <div>
      <label data-msg="desk.folio.stay_id">Stay ID: <input id="folio-stay-id" name="folio-stay-id" autocomplete="off"></label>
      <button id="open-button" type="button" data-msg="desk.folio.open_button">Open folio</button>
      <p id="open-error" role="alert" hidden></p>
    </div>

    <h2 data-msg="desk.folio.folio_heading">Folio lines and running balance</h2>
    <p id="folio-status" role="status"></p>
    <table id="folio-table">
      <thead>
        <tr><th data-msg="desk.folio.th_time">Time</th><th data-msg="desk.folio.th_item">Item</th><th data-msg="desk.folio.th_amount">Amount</th><th data-msg="desk.folio.th_balance">Running balance</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2 data-msg="desk.folio.charge_heading">Post a charge</h2>
    <div>
      <label><span data-msg="desk.folio.item_kind">Charge kind: </span><select id="charge-kind" name="charge-kind">
        <option value="nightly-room-charge" data-msg="desk.folio.kind_room">Room charge</option>
        <option value="charge-item" data-msg="desk.folio.kind_extra">Hotel extra (breakfast, parking, minibar)</option>
      </select></label>
      <label data-msg="desk.folio.item_name">Item name: <input id="charge-name" name="charge-name" autocomplete="off"></label>
      <label data-msg="desk.folio.amount_label">Amount: <input id="charge-amount" name="charge-amount" inputmode="decimal" autocomplete="off"></label>
      <button id="charge-button" type="button" data-msg="desk.folio.charge_button">Post charge</button>
      <p id="charge-status" role="status"></p>
      <p id="charge-error" role="alert" hidden></p>
    </div>

    <h2 data-msg="desk.folio.payment_heading">Record a payment</h2>
    <div>
      <label><span data-msg="desk.folio.method_label">Method: </span><select id="payment-method" name="payment-method">
        <option value="cash">cash</option>
        <option value="card">card</option>
      </select></label>
      <label data-msg="desk.folio.amount_label">Amount: <input id="payment-amount" name="payment-amount" inputmode="decimal" autocomplete="off"></label>
      <button id="pay-button" type="button" data-msg="desk.folio.pay_button">Record payment</button>
      <p id="payment-status" role="status"></p>
      <p id="payment-error" role="alert" hidden></p>
    </div>
  </section>

  <script src="messages.js"></script>
  <script>
    DeskMessages.init();
    // Desk folio view (issue #252, Screen 4): open the single folio
    // per stay, post room charges and hotel-defined extras, and
    // record cash/card payments, with the running balance always
    // re-read from the server so the screen agrees with what the
    // guest owes. Same static pattern as the admin console, the
    // today dashboard (frontend/desk.html), the booking form
    // (frontend/book.html), and the stay lifecycle
    // (frontend/stay.html): no build step, the page calls the
    // versioned contract paths through Nginx on this host with the
    // same Bearer session and role rules as the API. Desk-loop ops:
    // GetFolioBalance (stayId, actor) opens the folio; PostCharge
    // (stayId, itemKind, itemName, amountMinor, idempotencyKey,
    // actor) adds a charge line with item, amount, and time, and
    // the tax/fee on the line follow the hotel's own stored rules;
    // RecordPayment (stayId, method cash|card, amountMinor,
    // idempotencyKey, actor) subtracts from the balance. Every
    // mutating click carries an in-flight guard plus a
    // client-generated idempotencyKey; behaviour branches only on
    // envelope codes.
    (function () {
      var token = null;
      var displayName = "";
      var currentStayId = null;
      var opening = false;
      var charging = false;
      var paying = false;

      function show(id, message) {
        var el = document.getElementById(id);
        el.textContent = message;
        el.hidden = !message;
      }

      function status(id, message) {
        document.getElementById(id).textContent = message || "";
      }

      async function call(operation, body) {
        var routes = {
          SignIn: "/v1/admin/SignIn",
          SignOut: "/v1/admin/SignOut",
          GetFolioBalance: "/v1/billing/GetFolioBalance",
          PostCharge: "/v1/billing/PostCharge",
          RecordPayment: "/v1/billing/RecordPayment",
        };
        var headers = { "Content-Type": "application/json" };
        if (token) {
          headers["Authorization"] = "Bearer " + token;
        }
        var response = await fetch(routes[operation], {
          method: "POST",
          headers: headers,
          body: JSON.stringify(body || {}),
        });
        var payload = await response.json();
        if (!response.ok) {
          var failure = new Error(payload.message || payload.code || DeskMessages.msg("desk.admin.request_failed", { operation: operation }, "request failed: {operation}"));
          failure.code = payload.code;
          failure.details = payload.details || null;
          throw failure;
        }
        return payload;
      }

      function esc(value) {
        return String(value).replace(/[&<>"']/g, function (ch) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
        });
      }

      function isSignedOut(err) {
        return err && err.code === "UNAUTHENTICATED";
      }

      function signedOut() {
        token = null;
        displayName = "";
        currentStayId = null;
        document.getElementById("folio-section").hidden = true;
        document.getElementById("signin-section").hidden = false;
        document.getElementById("signin-secret").value = "";
      }

      function refuseSession() {
        signedOut();
        show("signin-error", DeskMessages.msg("desk.today.session_expired", {}, "Session expired. Sign in again."));
      }

      function newKey() {
        return (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : String(Date.now()) + "-" + String(Math.random()).slice(2);
      }

      function plainAmount(minor) {
        return (minor / 100).toFixed(2);
      }

      function parseMinor(text) {
        var trimmed = String(text).trim();
        if (!trimmed) {
          return null;
        }
        var major = Number(trimmed);
        if (!isFinite(major)) {
          return null;
        }
        return Math.round(major * 100);
      }

      function isCharge(line) {
        return typeof line.itemKind === "string" && typeof line.itemName === "string" &&
          typeof line.amountMinor === "number" && typeof line.postedAt === "string";
      }

      function isPayment(line) {
        return typeof line.method === "string" && typeof line.amountMinor === "number" &&
          typeof line.paidAt === "string" && line.itemKind === undefined;
      }

      function chargeTotal(line) {
        return line.amountMinor + (line.taxMinor || 0) + (line.feeMinor || 0);
      }

      function chargeItemText(line) {
        var extras = [];
        if (line.taxMinor) {
          extras.push("tax " + plainAmount(line.taxMinor));
        }
        if (line.feeMinor) {
          extras.push("fee " + plainAmount(line.feeMinor));
        }
        return extras.length ? line.itemName + " (" + extras.join(", ") + ")" : line.itemName;
      }

      function renderFolio(folio) {
        var entries = [];
        (folio.charges || []).forEach(function (line) {
          if (isCharge(line)) {
            entries.push({ at: line.postedAt, item: chargeItemText(line), delta: chargeTotal(line) });
          } else {
            entries.push({ at: "", item: DeskMessages.msg("desk.folio.raw_line", { raw: JSON.stringify(line) }, "Unrecognised line: " + JSON.stringify(line) + ".") });
          }
        });
        (folio.payments || []).forEach(function (line) {
          if (isPayment(line)) {
            entries.push({ at: line.paidAt, item: line.method + " payment", delta: -line.amountMinor });
          } else {
            entries.push({ at: "", item: DeskMessages.msg("desk.folio.raw_line", { raw: JSON.stringify(line) }, "Unrecognised line: " + JSON.stringify(line) + ".") });
          }
        });
        entries.sort(function (a, b) {
          return a.at < b.at ? -1 : (a.at > b.at ? 1 : 0);
        });
        var running = 0;
        var rows = entries.map(function (entry) {
          if (entry.delta === undefined) {
            return "<tr><td></td><td>" + esc(entry.item) + "</td><td></td><td></td></tr>";
          }
          running += entry.delta;
          return "<tr><td>" + esc(entry.at) + "</td><td>" + esc(entry.item) + "</td><td>" +
            esc(plainAmount(entry.delta)) + "</td><td>" + esc(plainAmount(running)) + "</td></tr>";
        });
        document.querySelector("#folio-table tbody").innerHTML = rows.join("") ||
          '<tr><td colspan="4">' + esc(DeskMessages.msg("desk.folio.no_lines", {}, "No charges or payments yet.")) + "</td></tr>";
        status("folio-status", DeskMessages.msg("desk.folio.folio_line", {
          folioId: folio.folioId,
          balance: plainAmount(folio.balanceMinor),
        }, "Folio " + folio.folioId + ": balance " + plainAmount(folio.balanceMinor) + "."));
      }

      async function openFolio() {
        var stayId = document.getElementById("folio-stay-id").value.trim();
        if (!stayId) {
          status("folio-status", DeskMessages.msg("desk.folio.need_stay", {}, "Enter a stay ID first."));
          return;
        }
        opening = true;
        var openButton = document.getElementById("open-button");
        openButton.disabled = true;
        show("open-error", "");
        try {
          var folio = await call("GetFolioBalance", { stayId: stayId, actor: displayName });
          currentStayId = stayId;
          renderFolio(folio);
        } catch (err) {
          if (isSignedOut(err)) {
            refuseSession();
            return;
          }
          show("open-error", err.message);
        } finally {
          opening = false;
          openButton.disabled = false;
        }
      }

      document.getElementById("open-button").addEventListener("click", async function () {
        if (opening) {
          return;
        }
        await openFolio();
      });

      document.getElementById("folio-stay-id").addEventListener("input", function () {
        currentStayId = null;
        status("folio-status", "");
        show("open-error", "");
      });

      document.getElementById("charge-button").addEventListener("click", async function () {
        if (charging) {
          return;
        }
        show("charge-error", "");
        var stayId = document.getElementById("folio-stay-id").value.trim();
        if (!stayId) {
          status("charge-status", DeskMessages.msg("desk.folio.need_stay", {}, "Enter a stay ID first."));
          return;
        }
        var itemName = document.getElementById("charge-name").value.trim();
        var amountMinor = parseMinor(document.getElementById("charge-amount").value);
        if (!itemName || amountMinor === null || amountMinor < 0) {
          status("charge-status", DeskMessages.msg("desk.folio.need_charge", {}, "Enter the item name and a non-negative amount first."));
          return;
        }
        charging = true;
        var chargeButton = document.getElementById("charge-button");
        chargeButton.disabled = true;
        try {
          var posted = await call("PostCharge", {
            stayId: stayId,
            itemKind: document.getElementById("charge-kind").value,
            itemName: itemName,
            amountMinor: amountMinor,
            actor: displayName,
            idempotencyKey: newKey(),
          });
          status("charge-status", DeskMessages.msg("desk.folio.charged", {
            itemName: posted.itemName,
            amount: plainAmount(chargeTotal(posted)),
            postedAt: posted.postedAt,
          }, "Posted " + posted.itemName + ": " + plainAmount(chargeTotal(posted)) + " at " + posted.postedAt + "."));
          document.getElementById("charge-name").value = "";
          document.getElementById("charge-amount").value = "";
          currentStayId = stayId;
          renderFolio(await call("GetFolioBalance", { stayId: stayId, actor: displayName }));
        } catch (err) {
          if (isSignedOut(err)) {
            refuseSession();
            return;
          }
          show("charge-error", err.message);
        } finally {
          charging = false;
          chargeButton.disabled = false;
        }
      });

      document.getElementById("pay-button").addEventListener("click", async function () {
        if (paying) {
          return;
        }
        show("payment-error", "");
        var stayId = document.getElementById("folio-stay-id").value.trim();
        if (!stayId) {
          status("payment-status", DeskMessages.msg("desk.folio.need_stay", {}, "Enter a stay ID first."));
          return;
        }
        var amountMinor = parseMinor(document.getElementById("payment-amount").value);
        if (amountMinor === null || amountMinor <= 0) {
          status("payment-status", DeskMessages.msg("desk.folio.need_payment", {}, "Enter a positive amount first."));
          return;
        }
        paying = true;
        var payButton = document.getElementById("pay-button");
        payButton.disabled = true;
        try {
          var method = document.getElementById("payment-method").value;
          var recorded = await call("RecordPayment", {
            stayId: stayId,
            method: method,
            amountMinor: amountMinor,
            actor: displayName,
            idempotencyKey: newKey(),
          });
          status("payment-status", DeskMessages.msg("desk.folio.paid", {
            method: recorded.method,
            amount: plainAmount(recorded.amountMinor),
            paidAt: recorded.paidAt,
          }, "Recorded " + recorded.method + " payment: " + plainAmount(recorded.amountMinor) + " at " + recorded.paidAt + "."));
          document.getElementById("payment-amount").value = "";
          currentStayId = stayId;
          renderFolio(await call("GetFolioBalance", { stayId: stayId, actor: displayName }));
        } catch (err) {
          if (isSignedOut(err)) {
            refuseSession();
            return;
          }
          show("payment-error", err.message);
        } finally {
          paying = false;
          payButton.disabled = false;
        }
      });

      document.getElementById("signin-form").addEventListener("submit", async function (event) {
        event.preventDefault();
        try {
          var payload = await call("SignIn", {
            signinIdentity: document.getElementById("signin-identity").value,
            secret: document.getElementById("signin-secret").value,
          });
          token = payload.token;
          displayName = payload.displayName;
          document.getElementById("whoami").textContent = payload.displayName;
          document.getElementById("myrole").textContent = payload.role;
          document.getElementById("signin-section").hidden = true;
          document.getElementById("folio-section").hidden = false;
          show("signin-error", "");
        } catch (err) {
          show("signin-error", err.message);
        }
      });

      document.getElementById("signout-button").addEventListener("click", async function () {
        try {
          await call("SignOut", {});
        } catch (err) {
          /* A dead token signs out locally all the same. */
        }
        signedOut();
      });

      (function prefill() {
        var params = new URLSearchParams(window.location.search);
        var stayId = params.get("stayId");
        if (stayId) {
          document.getElementById("folio-stay-id").value = stayId;
        }
      })();
    })();
  </script>
</body>
</html>
