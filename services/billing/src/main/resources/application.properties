server.port=${PORT:8087}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db:5432/hotel}
spring.datasource.username=${DB_USER:hotel}
spring.datasource.password=${DB_PASSWORD:change-me}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Finite server bounds (LLD section 29.3, AC-BND-3, Refs #630): packaged
# constants, never environment placeholders, so no deployment file,
# runbook step, or per-hotel setting carries or overrides them.
# Tomcat's connector timeout bounds the request line and headers and,
# with disableUploadTimeout at its true default, the request-body read;
# keep-alive bounds an idle socket; max-swallow-size bounds how much of
# an abandoned body the connector discards. Tomcat 10.1 has no
# response-write timeout property (LLD 29.7).
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=10s
server.tomcat.max-swallow-size=65536
