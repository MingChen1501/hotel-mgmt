# Nginx entry: static frontend plus the versioned module routes.
#
# Convention (see deploy/README.md): the external contract path
# /v1/<contract>/<Operation> passes through to the modules
# unchanged (proxy_pass without a URI part), because the skeleton
# services route the full versioned path at their own root
# (integration.md transport rule). The only rewrite is the install
# health check: /v1/<contract>/healthz maps to each module's root
# /healthz, which every module answers (deployment.md section 3).

events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  upstream reservations { server reservations:8081; }
  upstream rates { server rates:8082; }
  upstream reporting { server reporting:8083; }
  upstream stay { server stay:8084; }
  upstream rooms { server rooms:8085; }
  upstream guests { server guests:8086; }
  upstream billing { server billing:8087; }
  upstream admin { server admin:8088; }

  server {
    listen 80;

    # Proxy liveness (install health check, deployment.md section 3).
    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # Decommissioned legacy pages (Refs #299, ADR-0003 step 10):
    # every static inline-script page now lives on /app/, so the
    # old paths return a permanent redirect to the matching SPA
    # route. Exact matches only: /docs/* and /backup-report.json
    # keep serving from the location / block below.
    location = / { return 301 /app/; }
    location = /desk.html { return 301 /app/; }
    location = /book.html { return 301 /app/book; }
    location = /stay.html { return 301 /app/stay; }
    location = /folio.html { return 301 /app/folio; }
    location = /print.html { return 301 /app/print; }
    location = /admin.html { return 301 /app/admin; }

    # Static remainder (frontend/docs/ Swagger at /docs plus the
    # runtime backup-report.json): no SSR runtime.
    location / {
      root /usr/share/nginx/html;
      index index.html;
    }

    # Desk UI (Refs #291, #299, ADR-0003): the Vite static build
    # (`app/dist/`, bind-mounted at /srv/app-dist/) is served
    # under /app/ as the single desk UI. The block carries its
    # own `alias` (a sibling location's `root` never inherits) so
    # real nginx resolves files against the build output.
    # History-mode fallback is /app/index.html, NOT /index.html
    # (owner-mandated correction). Print screen served at
    # /app/print/ (Refs #297); admin console served at /app/admin/
    # (Refs #298).
    location /app/ {
      alias /srv/app-dist/;
      try_files $uri $uri/ /app/index.html;
    }

    # Install health checks (deployment.md section 3 step 5):
    # /v1/<contract>/healthz answers from each module's root
    # /healthz. Operation routes pass through unchanged so modules
    # receive the full versioned contract path they route.
    location = /v1/reservations/healthz { proxy_pass http://reservations/healthz; }
    location = /v1/rates/healthz { proxy_pass http://rates/healthz; }
    location = /v1/reporting/healthz { proxy_pass http://reporting/healthz; }
    location = /v1/stay/healthz { proxy_pass http://stay/healthz; }
    location = /v1/rooms/healthz { proxy_pass http://rooms/healthz; }
    location = /v1/guests/healthz { proxy_pass http://guests/healthz; }
    location = /v1/billing/healthz { proxy_pass http://billing/healthz; }
    location = /v1/admin/healthz { proxy_pass http://admin/healthz; }

    location /v1/reservations/ { proxy_pass http://reservations; }
    location /v1/rates/ { proxy_pass http://rates; }
    location /v1/reporting/ { proxy_pass http://reporting; }
    location /v1/stay/ { proxy_pass http://stay; }
    location /v1/rooms/ { proxy_pass http://rooms; }
    location /v1/guests/ { proxy_pass http://guests; }
    location /v1/billing/ { proxy_pass http://billing; }
    location /v1/admin/ { proxy_pass http://admin; }
  }
}
