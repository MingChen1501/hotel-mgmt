# Nginx entry: static frontend plus the versioned module routes.
#
# Convention (see deploy/README.md): Nginx owns the /v1/<contract>
# prefix and strips it before proxying, so modules route operation
# paths (/<Operation>) and /healthz at their own root. The external
# contract stays /v1/<contract>/<Operation> per
# docs/architecture/lld.md section 0.

events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  upstream reservations { server reservations:8081; }
  upstream rates { server rates:8082; }
  upstream reporting { server reporting:8083; }
  upstream stay { server stay:8084; }
  upstream rooms { server rooms:8085; }
  upstream guests { server guests:8086; }
  upstream billing { server billing:8087; }
  upstream admin { server admin:8088; }

  server {
    listen 80;

    # Proxy liveness (install health check, deployment.md section 3).
    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # Static desk entry (frontend/, no SSR runtime).
    location / {
      root /usr/share/nginx/html;
      index index.html;
    }

    location /v1/reservations/ { proxy_pass http://reservations:8081/; }
    location /v1/rates/ { proxy_pass http://rates:8082/; }
    location /v1/reporting/ { proxy_pass http://reporting:8083/; }
    location /v1/stay/ { proxy_pass http://stay:8084/; }
    location /v1/rooms/ { proxy_pass http://rooms:8085/; }
    location /v1/guests/ { proxy_pass http://guests:8086/; }
    location /v1/billing/ { proxy_pass http://billing:8087/; }
    location /v1/admin/ { proxy_pass http://admin:8088/; }
  }
}
