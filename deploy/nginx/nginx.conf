# Nginx entry: static frontend plus the versioned module routes.
#
# Convention (see deploy/README.md): the external contract path
# /v1/<contract>/<Operation> passes through to the modules
# unchanged (proxy_pass without a URI part), because the skeleton
# services route the full versioned path at their own root
# (integration.md transport rule). The only rewrite is the install
# health check: /v1/<contract>/healthz maps to each module's root
# /healthz, which every module answers (deployment.md section 3).

events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  upstream reservations { server reservations:8081; }
  upstream rates { server rates:8082; }
  upstream reporting { server reporting:8083; }
  upstream stay { server stay:8084; }
  upstream rooms { server rooms:8085; }
  upstream guests { server guests:8086; }
  upstream billing { server billing:8087; }
  upstream admin { server admin:8088; }

  server {
    listen 80;

    # Proxy liveness (install health check, deployment.md section 3).
    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # Static desk entry (frontend/, no SSR runtime).
    location / {
      root /usr/share/nginx/html;
      index index.html;
    }

    # Install health checks (deployment.md section 3 step 5):
    # /v1/<contract>/healthz answers from each module's root
    # /healthz. Operation routes pass through unchanged so modules
    # receive the full versioned contract path they route.
    location = /v1/reservations/healthz { proxy_pass http://reservations:8081/healthz; }
    location = /v1/rates/healthz { proxy_pass http://rates:8082/healthz; }
    location = /v1/reporting/healthz { proxy_pass http://reporting:8083/healthz; }
    location = /v1/stay/healthz { proxy_pass http://stay:8084/healthz; }
    location = /v1/rooms/healthz { proxy_pass http://rooms:8085/healthz; }
    location = /v1/guests/healthz { proxy_pass http://guests:8086/healthz; }
    location = /v1/billing/healthz { proxy_pass http://billing:8087/healthz; }
    location = /v1/admin/healthz { proxy_pass http://admin:8088/healthz; }

    location /v1/reservations/ { proxy_pass http://reservations:8081; }
    location /v1/rates/ { proxy_pass http://rates:8082; }
    location /v1/reporting/ { proxy_pass http://reporting:8083; }
    location /v1/stay/ { proxy_pass http://stay:8084; }
    location /v1/rooms/ { proxy_pass http://rooms:8085; }
    location /v1/guests/ { proxy_pass http://guests:8086; }
    location /v1/billing/ { proxy_pass http://billing:8087; }
    location /v1/admin/ { proxy_pass http://admin:8088; }
  }
}
