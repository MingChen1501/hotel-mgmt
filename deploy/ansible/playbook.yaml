---
# Install baseline: bundle + per-hotel config, then start database,
# modules, proxy in order; the install health check verifies every
# module through the proxy (see docs/devops/deployment.md section 3
# step 5 — only the proxy publishes a host port).
- name: Install hotel-mgmt single-host baseline
  hosts: hotel
  vars:
    bundle_dir: /opt/hotel-mgmt/bundle
    config_dir: /opt/hotel-mgmt/config
    staging_dir: /opt/hotel-mgmt/backup-staging
    hotel_config_src: "{{ hotel_config }}"
    modules:
      - { name: reservations, route: reservations }
      - { name: rates, route: rates }
      - { name: reporting, route: reporting }
      - { name: stay, route: stay }
      - { name: rooms, route: rooms }
      - { name: guests, route: guests }
      - { name: billing, route: billing }
      - { name: admin, route: admin }
  tasks:
    - name: Validate the per-hotel configuration set against the release schema
      delegate_to: localhost
      ansible.builtin.command:
        cmd: "{{ bundle_src }}/script/validate-hotel-config.sh --config {{ hotel_config_src }}"
      changed_when: false

    - name: Validate the per-hotel configuration set parses as JSON
      delegate_to: localhost
      ansible.builtin.command:
        cmd: python3 -c "import json,sys; json.load(open(sys.argv[1]))"
        argv:
          - "{{ hotel_config_src }}"
      changed_when: false

    - name: Fail closed while database or boot secrets are still dev defaults
      delegate_to: localhost
      ansible.builtin.fail:
        msg: "Refusing install: DB_PASSWORD or ADMIN_BOOT_SECRET still holds a dev default. Provision the per-sale secrets first (docs/devops/deployment.md section 2; audit S3)."
      when: >-
        lookup('env', 'DB_PASSWORD') in ['', 'change-me', 'change-me-dev-only']
        or lookup('env', 'ADMIN_BOOT_SECRET') in ['', 'change-me', 'change-me-dev-only']

    - name: Create install directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ bundle_dir }}"
        - "{{ config_dir }}"
        - "{{ staging_dir }}"

    - name: Copy the release bundle
      ansible.builtin.copy:
        src: "{{ bundle_src }}/"
        dest: "{{ bundle_dir }}/"
        mode: preserve

    - name: Copy the per-hotel configuration set
      ansible.builtin.copy:
        src: "{{ hotel_config_src }}"
        dest: "{{ config_dir }}/hotel.json"
        mode: "0640"

    - name: Start the database host first
      ansible.builtin.command:
        cmd: docker compose -f deploy/compose.yaml up -d db
        chdir: "{{ bundle_dir }}"
      changed_when: true

    - name: Wait for the database to accept connections
      ansible.builtin.command:
        cmd: docker compose -f deploy/compose.yaml exec -T db pg_isready -U hotel -d hotel
        chdir: "{{ bundle_dir }}"
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 24
      delay: 5
      changed_when: false

    - name: Start the module containers
      ansible.builtin.command:
        cmd: docker compose -f deploy/compose.yaml up -d {{ modules | map(attribute='name') | join(' ') }}
        chdir: "{{ bundle_dir }}"
      changed_when: true

    # Desk UI migration shell (Refs #291): the proxy bind-mounts
    # app/dist/ at /srv/app-dist (never nested under the :ro
    # frontend mount), and dist/ is gitignored, so the build must
    # exist before the proxy starts. A bundle copied from a checkout
    # with a built dist already carries it (filesystem copy); only
    # build on the target when it is missing.
    - name: Check for a built desk UI migration shell
      ansible.builtin.stat:
        path: "{{ bundle_dir }}/app/dist/index.html"
      register: app_dist
      changed_when: false

    - name: Build the desk UI migration shell when missing
      ansible.builtin.command:
        cmd: npm ci && npm run build
        chdir: "{{ bundle_dir }}/app"
      when: not app_dist.stat.exists
      changed_when: true

    - name: Start the reverse proxy last
      ansible.builtin.command:
        cmd: docker compose -f deploy/compose.yaml up -d proxy
        chdir: "{{ bundle_dir }}"
      changed_when: true

    - name: Check the desk entry through the proxy
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
      register: proxy_root
      until: proxy_root.status == 200
      retries: 12
      delay: 5

    - name: Check each module through the proxy
      ansible.builtin.uri:
        url: http://127.0.0.1/v1/{{ item.route }}/healthz
        status_code: 200
      register: proxy_health
      until: proxy_health.status == 200
      retries: 12
      delay: 5
      loop: "{{ modules }}"

    - name: Apply the per-hotel configuration set through Admin
      ansible.builtin.command:
        cmd: "{{ bundle_dir }}/script/apply-hotel-config.sh --config {{ config_dir }}/hotel.json --base-url http://127.0.0.1"
        chdir: "{{ bundle_dir }}"
      environment:
        ADMIN_BOOT_SECRET: "{{ lookup('env', 'ADMIN_BOOT_SECRET') }}"
      changed_when: true
