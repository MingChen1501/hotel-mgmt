# Single-host install baseline (see docs/devops/deployment.md, section 3).
#
# One engine, eight module schemas: every migration is schema-qualified,
# so one PostgreSQL engine serves all modules (see
# docs/architecture/system-architecture.md). Start order is encoded
# with depends_on: database first, then the module containers, then
# the reverse proxy (the reverse of the upgrade stop order in
# deployment.md section 4).
#
# Run from the repo root:
#   DB_PASSWORD=<secret> docker compose -f deploy/compose.yaml up -d --build
#
# The per-hotel configuration set lives in deploy/config/ (example:
# hotel.example.json) and is mounted next to the bundle, never baked
# into images (deployment.md section 2).

name: hotel-mgmt

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backup-staging:/backup-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - hotel-lan

  reservations:
    build: ../services/reservations
    image: hotel-reservations:0.1.0
    environment:
      PORT: "8081"
      # Consumed from the first store slice on; the skeleton only answers /healthz.
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
      # Direct rates base URL for the server-side stay-restriction check
      # (FR-RTE-4, issue #361); the caller Bearer token travels on the call.
      RATES_BASE_URL: http://rates:8082
      # Direct rooms base URL for the server-derived sellable ceiling the
      # overbooking guard counts against (ADR-0006, issue #631); the caller
      # Bearer token travels on the call and an unread ceiling fails closed.
      ROOMS_BASE_URL: http://rooms:8085
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  rates:
    build: ../services/rates
    image: hotel-rates:0.1.0
    environment:
      PORT: "8082"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  reporting:
    build: ../services/reporting
    image: hotel-reporting:0.1.0
    environment:
      PORT: "8083"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  stay:
    build: ../services/stay
    image: hotel-stay:0.1.0
    environment:
      PORT: "8084"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
      # Booking completion behind a committed check-out (FR-DEP-1,
      # #646); the caller Bearer token travels on the call.
      RESERVATIONS_BASE_URL: http://reservations:8081
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  rooms:
    build: ../services/rooms
    image: hotel-rooms:0.1.0
    environment:
      PORT: "8085"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  guests:
    build: ../services/guests
    image: hotel-guests:0.1.0
    environment:
      PORT: "8086"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  billing:
    build: ../services/billing
    image: hotel-billing:0.1.0
    environment:
      PORT: "8087"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
      DB_USER: hotel
      DB_PASSWORD: ${DB_PASSWORD:-change-me-dev-only}
      # Every folio write verifies the stay through Stay GetStayRef
      # (ADR-0008, #634); the caller Bearer token travels on the call
      # and an unreadable Stay fails the write closed.
      STAY_BASE_URL: http://stay:8084
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  admin:
    build: ../services/admin
    image: hotel-admin:0.1.0
    environment:
      PORT: "8088"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
      # Per-sale Admin secrets (deployment.md section 2, Refs #638).
      # Both are required: Admin refuses to boot without them outside
      # the ADMIN_DEV_MODE=1 dev switch, so the bundle supplies no
      # fallback and the switch is never set here. script/preflight.sh
      # and the Ansible playbook fail closed while a value is missing
      # or still a published default (audit S3).
      ADMIN_TOKEN_KEY: ${ADMIN_TOKEN_KEY:?ADMIN_TOKEN_KEY must be set to a per-sale signing key (deployment.md section 2)}
      ADMIN_BOOT_IDENTITY: ${ADMIN_BOOT_IDENTITY:-owner}
      ADMIN_BOOT_SECRET: ${ADMIN_BOOT_SECRET:?ADMIN_BOOT_SECRET must be set to a per-sale owner boot secret (deployment.md section 2)}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
      # Desk UI (Refs #291, #299): the Vite static build
      # (`app/dist/`, built by `npm run build` / the CI app-build
      # job, or by script/e2e-desk-loop.sh before compose up) is
      # served under /app/ via the matching `alias` in nginx.conf.
      # It mounts at a separate top-level container path on purpose:
      # nesting it under the :ro frontend mount above fails proxy
      # creation (the mountpoint cannot be created on a read-only
      # mount), and dist/ is gitignored so it must be built first.
      - ../app/dist:/srv/app-dist:ro
    depends_on:
      - reservations
      - rates
      - reporting
      - stay
      - rooms
      - guests
      - billing
      - admin
    networks:
      - hotel-lan

volumes:
  pgdata:
  # On-premise backup staging area (deployment.md section 3; rotation
  # in docs/operations/backup-dr.md).
  backup-staging:

networks:
  hotel-lan:
    driver: bridge
