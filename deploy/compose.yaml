# Single-host install baseline (see docs/devops/deployment.md, section 3).
#
# One engine, eight module schemas: every migration is schema-qualified,
# so one PostgreSQL engine serves all modules (see
# docs/architecture/system-architecture.md). Start order is encoded
# with depends_on: database first, then the module containers, then
# the reverse proxy (the reverse of the upgrade stop order in
# deployment.md section 4).
#
# Run from the repo root:
#   DB_PASSWORD=<secret> docker compose -f deploy/compose.yaml up -d --build
#
# The per-hotel configuration set lives in deploy/config/ (example:
# hotel.example.json) and is mounted next to the bundle, never baked
# into images (deployment.md section 2).

name: hotel-mgmt

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backup-staging:/backup-staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - hotel-lan

  reservations:
    build: ../services/reservations
    image: hotel-reservations:0.1.0
    environment:
      PORT: "8081"
      # Consumed from the first store slice on; the skeleton only answers /healthz.
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  rates:
    build: ../services/rates
    image: hotel-rates:0.1.0
    environment:
      PORT: "8082"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  reporting:
    build: ../services/reporting
    image: hotel-reporting:0.1.0
    environment:
      PORT: "8083"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  stay:
    build: ../services/stay
    image: hotel-stay:0.1.0
    environment:
      PORT: "8084"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  rooms:
    build: ../services/rooms
    image: hotel-rooms:0.1.0
    environment:
      PORT: "8085"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  guests:
    build: ../services/guests
    image: hotel-guests:0.1.0
    environment:
      PORT: "8086"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  billing:
    build: ../services/billing
    image: hotel-billing:0.1.0
    environment:
      PORT: "8087"
      DATABASE_URL: jdbc:postgresql://db:5432/hotel
      DB_USER: hotel
      DB_PASSWORD: ${DB_PASSWORD:-change-me-dev-only}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  admin:
    build: ../services/admin
    image: hotel-admin:0.1.0
    environment:
      PORT: "8088"
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-change-me-dev-only}@db:5432/hotel
      # Per-sale boot identity for the owner account (deployment.md
      # section 2). The skeleton default keeps the container lab
      # working; script/preflight.sh and the Ansible playbook fail
      # closed while these defaults are unchanged (audit S3).
      ADMIN_BOOT_IDENTITY: ${ADMIN_BOOT_IDENTITY:-owner}
      ADMIN_BOOT_SECRET: ${ADMIN_BOOT_SECRET:-change-me-dev-only}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel-lan

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - reservations
      - rates
      - reporting
      - stay
      - rooms
      - guests
      - billing
      - admin
    networks:
      - hotel-lan

volumes:
  pgdata:
  # On-premise backup staging area (deployment.md section 3; rotation
  # in docs/operations/backup-dr.md).
  backup-staging:

networks:
  hotel-lan:
    driver: bridge
